name: Deploy QA

on:
  push:
    branches: [dev]

jobs:
  deploy:
    name: Deploy → resubidos-qa
    runs-on: ubuntu-latest

    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/kalaplex/resubidos-qa

            # Backup del build actual para rollback
            if [[ -d .next ]]; then
              rm -rf .next_backup
              cp -r .next .next_backup
            fi

            rollback() {
              echo "Deploy falló. Restaurando build anterior..."
              if [[ -d .next_backup ]]; then
                rm -rf .next
                mv .next_backup .next
              fi
              sudo systemctl restart resubidos-qa.service || true
              echo "Rollback completado. Revisa: journalctl -u resubidos-qa.service -n 50"
            }
            trap rollback ERR

            git pull origin dev
            npm ci --prefer-offline
            npm run db:generate
            npm run build
            npm run db:migrate:deploy
            if [[ ! -d /var/www/resubidos-qa || ! -w /var/www/resubidos-qa ]]; then
              echo "El directorio /var/www/resubidos-qa no existe o no es escribible por $(id -un)." >&2
              echo "Créalo una vez con: sudo install -d -o $(id -un) -g www-data -m 0755 /var/www/resubidos-qa" >&2
              exit 1
            fi
            install -m 0644 public/directo/index.html /var/www/resubidos-qa/directo.html
            sudo systemctl restart resubidos-qa.service
            systemctl is-active resubidos-qa.service

            trap - ERR
            rm -rf .next_backup

services:
  postgres:
    image: postgres:16
    container_name: lolweapon-resubidos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lolweapon_resubidos}
      POSTGRES_USER: ${POSTGRES_USER:-lolweapon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lolweapon}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lolweapon} -d ${POSTGRES_DB:-lolweapon_resubidos}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
